<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="images\isda_noboarder.png">
    <title>DRAWBOX</title>
     <link href="../style.css" rel="stylesheet" type="text/css" media="all">
     <style>
        * {box-sizing: border-box;}
        canvas {
            border: 1px solid black;
            cursor: crosshair;
        }
        #gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .image-container {
            border: 1px solid #ccc;
            padding: 5px;
            max-width: 200px;
            text-align: center;
        }
        .image-container img {
            max-width: 100%;
            height: auto;
            display: block;
        }
     </style>
</head>
<body>
    <h1>DRAWBOX</h1> 
    <p>Draw me a picture!</p>
    <p>I might add some daily doodles as well :D</p>
    <form action="..\index.html" method="get">
        <button type="submit" formtarget="_blank" title="drawbox!">back to home</button>
       </form>
    <hr>    
    <canvas id="drawboxcanvas" width="500" height="500"></canvas>
    <br>
    <div onclick="change_color(this)" style="background:red" class="stroke-color"></div>
    <div onclick="change_color(this)" style="background:blue" class="stroke-color"></div>
    
   
    
    <input type="color" oninput="stroke_color = this.value">
    <label for="StrokeAmount"><strong> | Stroke Size: </strong></label>
    <input type="range" id="Strokewidth" name="Strokewidth" min="1" max="100" value="2" oninput="stroke_width = this.value; StrokeAmount.value=this.value" title="stroke width">
    <!--See the stroke value-->
    <output name="StrokeAmount" id="StrokeAmount" for="Stokewidth">2</output>
    <br><br>
    <label for="BrushType"><strong>Brush type:</strong></label>
  <select id="BrushType" name="BrushType" oninput="stroke_join = this.value">
    <option value="round" selected>Round</option>
    <option value="bevel">bevel</option>
    <option value="miter">miter</option>
    </select><span> | </span>
     <label for="LineCap"><strong>Line Cap:</strong></label>
  <select id="LineCap" name="LineCap" oninput="line_cap = this.value">
    <option value="round" selected>Round</option>
    <option value="butt">Butt</option>
    <option value="square">Square</option>
    </select>
    <br><br>
    <label for="Name"><strong>Your Name / Website:</strong></label>
    <input type="text" oninput="user_name = this.value" required>
    <br>
    <br>
    <button onclick="Restore()" title="undo button">Undo</button>
    <button onclick="Clear()" title="clear button">Clear</button>
    <button id="submit">Submit drawing</button>
    <p id="status"></p>
    <hr>
    <h1>Submitted Drawings ☻</h1>
    <hr>
    <div id="gallery">Loading images...</div>
    <hr>
    <br>
    <script src="../js/drawbox.js"></script>
    <p>Make your own Drawbox page: <a href="https://drawbox.nekoweb.org/">drawbox.nekoweb.org</a></p>
</body>
</html>
